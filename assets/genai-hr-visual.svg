      <g transform="translate(366 64)"><rect width="302" height="62" rx="13" fill="#0d1425"/><circle cx="30" cy="31" r="13" fill="#a78bfa" opacity=".9"/><text x="56" y="28" fill="#f8fafc" font-size="14">Semantic chunking</text><text x="56" y="46" fill="#94a3b8" font-size="12">Stanza + LangChain</text>
