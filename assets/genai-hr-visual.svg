<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Abstract GenAI recruiting analytics visual</title>
  <desc id="desc">A designed portfolio illustration of resume ingestion, semantic matching, vector retrieval, and human-reviewed candidate evaluation. It is not a screenshot of the project.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101526"/><stop offset="1" stop-color="#1d2541"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#60a5fa"/></linearGradient></defs>
  <rect width="1200" height="720" rx="40" fill="url(#bg)"/><circle cx="1080" cy="70" r="250" fill="#7c3aed" opacity=".10"/><circle cx="80" cy="680" r="260" fill="#2563eb" opacity=".09"/>
  <g transform="translate(70 60)"><rect width="1060" height="600" rx="28" fill="#0c1222" stroke="#e0e7ff" stroke-opacity=".13"/>
