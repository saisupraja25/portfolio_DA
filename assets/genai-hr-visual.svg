      <g transform="translate(24 210)"><rect width="212" height="126" rx="15" fill="#0d1425"/><path d="M28 25h75v72H28z" fill="#222d49"/><path d="M42 42h48M42 56h48M42 70h36" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/><text x="120" y="52" fill="#f8fafc" font-size="14">Job description</text><text x="120" y="76" fill="#94a3b8" font-size="12">Role requirements</text></g>
