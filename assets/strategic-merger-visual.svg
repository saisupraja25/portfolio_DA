<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Abstract strategic merger analytics visual</title>
  <desc id="desc">A designed portfolio illustration with user growth, engagement, content mix, and revenue dashboard elements. It is not a screenshot of the project.</desc>
  <defs>
