    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="720" rx="40" fill="url(#bg)"/>
  <circle cx="1030" cy="80" r="220" fill="#2563eb" opacity=".08"/>
  <circle cx="120" cy="660" r="240" fill="#14b8a6" opacity=".08"/>
